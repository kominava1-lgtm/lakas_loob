<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote moderation | Lakas-Loob</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#172b3a;background:#f2f5f4;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
header{background:#123c69;color:#fff;padding:20px max(20px,calc((100vw - 900px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
header strong{font-size:20px}
a{color:inherit}
header a{font-size:14px;text-decoration-thickness:1px;text-underline-offset:3px}
main{width:min(900px,calc(100% - 32px));margin:36px auto}
h1{font-size:30px;margin:0 0 6px}
.intro{margin:0 0 24px;color:#52616b}
.access{display:flex;align-items:end;gap:10px;flex-wrap:wrap;padding:16px 0;border-top:1px solid #cad3d6;border-bottom:1px solid #cad3d6}
label{display:grid;gap:6px;font-size:14px;font-weight:600;flex:1 1 260px}
input{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border:1px solid #aab8be;border-radius:4px;background:#fff;color:#172b3a}
button{font:inherit;font-weight:600;border:0;border-radius:4px;min-height:42px;padding:9px 14px;cursor:pointer;background:#dce6e8;color:#123c69}
button:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e5a928;outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
button.primary{background:#123c69;color:#fff}
#status{min-height:24px;margin:14px 0;color:#52616b}
#status.error{color:#a3273f}
#messages{display:grid;gap:12px}
.message{background:#fff;border:1px solid #d2dcde;border-left:4px solid #2f7d6b;padding:16px}
.message p{margin:0;overflow-wrap:anywhere;line-height:1.5}
.message small{display:block;margin-top:8px;color:#52616b}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.reject{background:#f7e4e7;color:#8d2136}
@media(max-width:520px){header{padding:16px}main{margin:24px auto}.access button{width:100%}.actions button{flex:1}}
</style>
</head>
<body>
<header><strong>Lakas-Loob</strong><a href="/">Open public page</a></header>
<main>
  <h1>Message moderation</h1>
  <p class="intro">Review community messages before they appear on the public page.</p>
  <form class="access" id="accessForm">
    <label for="moderatorKey">Moderator key
      <input id="moderatorKey" type="password" autocomplete="current-password" required>
    </label>
    <button class="primary" id="loadButton" type="submit">Load messages</button>
  </form>
  <p id="status" role="status" aria-live="polite">Enter your moderator key to load pending messages.</p>
  <section id="messages" aria-label="Messages waiting for review"></section>
</main>
<script>
const keyInput=document.getElementById("moderatorKey");
const accessForm=document.getElementById("accessForm");
const loadButton=document.getElementById("loadButton");
const statusText=document.getElementById("status");
const messages=document.getElementById("messages");
let moderatorToken="";
let pending=[];

function setStatus(message,isError=false){
  statusText.textContent=message;
  statusText.classList.toggle("error",isError);
}
function renderMessages(){
  messages.replaceChildren();
  if(!pending.length){
    setStatus("No messages are waiting for review.");
    return;
  }
  setStatus(`${pending.length} message${pending.length===1?"":"s"} waiting for review.`);
  pending.forEach(item=>{
    const article=document.createElement("article");
    article.className="message";
    const text=document.createElement("p");
    text.textContent=item.text;
    article.appendChild(text);
    const topic=document.createElement("small");
    topic.textContent=item.tag?`About ${item.tag.toLowerCase()}`:"No topic";
    article.appendChild(topic);
    const actions=document.createElement("div");
    actions.className="actions";
    const rejectButton=document.createElement("button");
    rejectButton.className="reject";
    rejectButton.textContent="Reject";
    rejectButton.onclick=()=>moderate(item.id,"reject");
    const approveButton=document.createElement("button");
    approveButton.className="primary";
    approveButton.textContent="Approve";
    approveButton.onclick=()=>moderate(item.id,"approve");
    actions.append(rejectButton,approveButton);
    article.appendChild(actions);
    messages.appendChild(article);
  });
}
async function loadPending(){
  setStatus("Loading messages...");
  loadButton.disabled=true;
  try{
    const response=await fetch("/.netlify/functions/moderate-quotes",{
      headers:{Authorization:`Bearer ${moderatorToken}`},
      cache:"no-store"
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Could not load messages.");
    pending=data.items||[];
    renderMessages();
  }catch(error){
    pending=[];
    messages.replaceChildren();
    setStatus(error.message||"Could not load messages.",true);
  }finally{
    loadButton.disabled=false;
  }
}
async function moderate(id,action){
  setStatus(action==="approve"?"Approving message...":"Rejecting message...");
  try{
    const response=await fetch("/.netlify/functions/moderate-quotes",{
      method:"POST",
      headers:{"Content-Type":"application/json",Authorization:`Bearer ${moderatorToken}`},
      body:JSON.stringify({id,action})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Could not update message.");
    await loadPending();
  }catch(error){
    setStatus(error.message||"Could not update message.",true);
  }
}
accessForm.addEventListener("submit",event=>{
  event.preventDefault();
  moderatorToken=keyInput.value.trim();
  if(moderatorToken)loadPending();
});
</script>
</body>
</html>
